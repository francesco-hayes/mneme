<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 730" width="760" height="730" role="img" aria-labelledby="title desc">
  <title id="title">Releasing a new version of Mneme</title>
  <desc id="desc">Six steps. You set the new version with pnpm bump, then commit and push to main. GitHub checks whether that version is new. If it was already released, nothing is built. If it is new, GitHub builds the Mac app and creates a draft release with the files attached. You add the notes and publish it.</desc>
  <style>
    :root {
      --text: #1f2328; --muted: #59636e;
      --you-fill: #eef4ff; --you-stroke: #3b6fd9; --you-dot: #3b6fd9;
      --gh-fill: #f4f6f8; --gh-stroke: #c5ccd6; --gh-dot: #6e7781;
      --skip-stroke: #a0a8b3; --arrow: #8c959f; --code-fill: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #e6edf3; --muted: #9198a1;
        --you-fill: #15233c; --you-stroke: #5b8def; --you-dot: #4c7fe6;
        --gh-fill: #1c2128; --gh-stroke: #3d444d; --gh-dot: #656d76;
        --skip-stroke: #545d68; --arrow: #6e7681; --code-fill: #0d1117;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
    .h { font-size: 20px; font-weight: 700; }
    .t { font-size: 16px; font-weight: 600; }
    .s { font-size: 13px; fill: var(--muted); }
    .tag { font-size: 12px; fill: var(--muted); }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: var(--text); }
    .n { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .you { fill: var(--you-fill); stroke: var(--you-stroke); stroke-width: 1.5; }
    .gh { fill: var(--gh-fill); stroke: var(--gh-stroke); stroke-width: 1.5; }
    .skip { fill: none; stroke: var(--skip-stroke); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .dot-you { fill: var(--you-dot); }
    .dot-gh { fill: var(--gh-dot); }
    .codebox { fill: var(--code-fill); stroke: var(--gh-stroke); stroke-width: 1; }
    .line { stroke: var(--arrow); stroke-width: 2; fill: none; }
    .head { fill: var(--arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Heading and legend -->
  <text class="h" x="40" y="42">Releasing a new version</text>
  <rect class="you" x="476" y="27" width="18" height="18" rx="5"/>
  <text class="tag" x="502" y="41">You do this</text>
  <rect class="gh" x="600" y="27" width="18" height="18" rx="5"/>
  <text class="tag" x="626" y="41">GitHub does this</text>

  <!-- 1 -->
  <rect class="you" x="40" y="70" width="480" height="78" rx="12"/>
  <circle class="dot-you" cx="76" cy="109" r="16"/>
  <text class="n" x="76" y="114" text-anchor="middle">1</text>
  <text class="t" x="108" y="100">Set the new version</text>
  <rect class="codebox" x="108" y="111" width="138" height="24" rx="6"/>
  <text class="code" x="118" y="128">pnpm bump 0.2.0</text>
  <text class="tag" x="504" y="100" text-anchor="end">on your Mac</text>

  <line class="line" x1="280" y1="148" x2="280" y2="180" marker-end="url(#arrow)"/>

  <!-- 2 -->
  <rect class="you" x="40" y="184" width="480" height="78" rx="12"/>
  <circle class="dot-you" cx="76" cy="223" r="16"/>
  <text class="n" x="76" y="228" text-anchor="middle">2</text>
  <text class="t" x="108" y="214">Commit and push to main</text>
  <text class="s" x="108" y="239">Or merge a pull request into main</text>
  <text class="tag" x="504" y="214" text-anchor="end">on your Mac</text>

  <line class="line" x1="280" y1="262" x2="280" y2="294" marker-end="url(#arrow)"/>

  <!-- 3 -->
  <rect class="gh" x="40" y="298" width="480" height="78" rx="12"/>
  <circle class="dot-gh" cx="76" cy="337" r="16"/>
  <text class="n" x="76" y="342" text-anchor="middle">3</text>
  <text class="t" x="108" y="328">Checks the version</text>
  <text class="s" x="108" y="353">Is there a release for v0.2.0 yet?</text>
  <text class="tag" x="504" y="328" text-anchor="end">a few seconds</text>

  <!-- branch: already released -->
  <line class="line" x1="520" y1="337" x2="552" y2="337" marker-end="url(#arrow)"/>
  <text class="tag" x="536" y="328" text-anchor="middle">yes</text>
  <rect class="skip" x="556" y="298" width="164" height="78" rx="12"/>
  <text class="t" x="572" y="328">Stops here</text>
  <text class="s" x="572" y="349">Nothing is built</text>
  <text class="s" x="572" y="366">for an old version</text>

  <line class="line" x1="280" y1="376" x2="280" y2="408" marker-end="url(#arrow)"/>
  <text class="tag" x="290" y="397">no, it's new</text>

  <!-- 4 -->
  <rect class="gh" x="40" y="412" width="480" height="78" rx="12"/>
  <circle class="dot-gh" cx="76" cy="451" r="16"/>
  <text class="n" x="76" y="456" text-anchor="middle">4</text>
  <text class="t" x="108" y="442">Builds the Mac app</text>
  <text class="s" x="108" y="467">The DMG, a zip of the app, and checksums</text>
  <text class="tag" x="504" y="442" text-anchor="end">about 20 minutes</text>

  <line class="line" x1="280" y1="490" x2="280" y2="522" marker-end="url(#arrow)"/>

  <!-- 5 -->
  <rect class="gh" x="40" y="526" width="480" height="78" rx="12"/>
  <circle class="dot-gh" cx="76" cy="565" r="16"/>
  <text class="n" x="76" y="570" text-anchor="middle">5</text>
  <text class="t" x="108" y="556">Creates a draft release</text>
  <text class="s" x="108" y="581">Tagged v0.2.0, files attached. Only you can see it.</text>

  <line class="line" x1="280" y1="604" x2="280" y2="636" marker-end="url(#arrow)"/>

  <!-- 6 -->
  <rect class="you" x="40" y="640" width="480" height="78" rx="12"/>
  <circle class="dot-you" cx="76" cy="679" r="16"/>
  <text class="n" x="76" y="684" text-anchor="middle">6</text>
  <text class="t" x="108" y="670">Add the notes and publish</text>
  <text class="s" x="108" y="695">Releases page, edit the draft, Publish release</text>
  <text class="tag" x="504" y="670" text-anchor="end">on GitHub</text>
</svg>
