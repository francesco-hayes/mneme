# Builds the Mac app and puts it in a draft GitHub release when the version
# changes on main.
#
# On every push to main, the "check" job reads the version from Cargo.toml
# ([workspace.package]) and package.json. If they differ, it fails. If a tag or
# release for v<version> already exists, it stops there and nothing is built.
# Otherwise the "macos" job builds the app, creates the tag v<version> on that
# commit, and creates a draft release with the files attached. You then write
# the notes and publish the draft. `pnpm bump 0.2.0` sets the version.
#
# It can also be run by hand (Actions, Release, Run workflow) for an existing
# tag, to rebuild its files. They replace the files on that tag's release, or
# a draft is made if it has none.
#
# The tag is created with the workflow's own token, which does not start other
# workflows, and before the draft, so publishing the draft creates no new tag.
#
# The app is signed ad hoc, not with a Developer ID, and not notarized: there
# is no Apple Developer account yet. People who download it approve it once in
# System Settings, Privacy & Security, Open Anyway (see README, "Install").
# Signed and notarized releases are scripts/release.sh, run by hand.
#
# Mac only, Apple Silicon only: system audio capture is macOS-only, and the
# app needs macOS 14.4 or later.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild the files for, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  check:
    name: Is this a new version?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_TAG: ${{ inputs.tag }}
    outputs:
      build: ${{ steps.decide.outputs.build }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false

      - name: Decide
        id: decide
        run: |
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          node_version="$(jq -r .version package.json)"
          echo "Cargo.toml $cargo_version, package.json $node_version"
          if [ "$cargo_version" != "$node_version" ]; then
            echo "::error::The version in Cargo.toml ($cargo_version) and package.json ($node_version) differ. Set both with: pnpm bump <version>"
            exit 1
          fi

          if [ -n "$INPUT_TAG" ]; then
            echo "Run by hand for $INPUT_TAG."
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="v$cargo_version"
          release="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName --jq ".[] | select(.tagName == \"$tag\") | .tagName")"
          if [ -n "$release" ] || gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "$tag is already tagged or released. Nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "$tag is new. Building a draft release."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS (Apple Silicon)
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    concurrency:
      group: release-${{ needs.check.outputs.tag }}
      cancel-in-progress: false
    env:
      TAG: ${{ needs.check.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check the tag matches the app version
        run: |
          tag_version="${TAG#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "mneme") | .version')"
          node_version="$(node -p 'require("./package.json").version')"
          echo "tag $TAG, Cargo.toml $cargo_version, package.json $node_version"
          if [ "$tag_version" != "$cargo_version" ] || [ "$tag_version" != "$node_version" ]; then
            echo "::error::Tag $TAG does not match the app version (Cargo.toml $cargo_version, package.json $node_version)."
            exit 1
          fi
          echo "VERSION=$cargo_version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          cargo fetch --locked

      - name: Local-only audit
        run: scripts/audit-local-only.sh

      - name: Build
        run: pnpm tauri build --config src-tauri/tauri.github-release.conf.json

      - name: Check the signature
        run: |
          app="target/release/bundle/macos/Mneme.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -q '^Signature=adhoc'

      - name: Collect files
        run: |
          mkdir -p dist-release
          dmg="$(ls target/release/bundle/dmg/*.dmg)"
          cp "$dmg" "dist-release/Mneme-$VERSION-macos-arm64.dmg"
          ditto -c -k --keepParent target/release/bundle/macos/Mneme.app \
            "dist-release/Mneme-$VERSION-macos-arm64.zip"
          cd dist-release
          shasum -a 256 -- *.dmg *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach to the release
        run: |
          existing="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isDraft --jq ".[] | select(.tagName == \"$TAG\") | .isDraft")"
          if [ -n "$existing" ]; then
            echo "Release $TAG exists (draft: $existing), replacing its files."
            gh release upload "$TAG" dist-release/* --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            sha="$(git rev-parse HEAD)"
            echo "Creating tag $TAG at $sha."
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$sha" > /dev/null
          fi
          echo "Creating draft release $TAG."
          gh release create "$TAG" dist-release/* --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "Mneme $VERSION" \
            --notes "Draft built from $TAG. Replace this with the release notes, check the files below, then publish."
